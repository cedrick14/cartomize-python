name: Desktop lifecycle acceptance
on:
  push:
    branches: [real-project-validation]
    paths: ['.github/workflows/desktop-lifecycle.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    if: github.ref == 'refs/heads/real-project-validation'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: real-project-validation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ensure the responsiveness test always releases its worker
        shell: python
        run: |
          import ast
          from pathlib import Path
          path = Path('tests/test_desktop.py')
          text = path.read_text(encoding='utf-8')
          name = 'test_background_job_keeps_event_loop_responsive_and_cancels'
          node = next(n for n in ast.parse(text).body if isinstance(n, ast.FunctionDef) and n.name == name)
          old = ast.get_source_segment(text, node)
          replacement = '''def test_background_job_keeps_event_loop_responsive_and_cancels(application,tmp_path):
              from cartomize.desktop import CartomizeWindow
              window=CartomizeWindow();window.show();window.select_tool('workflow')
              ticks=[];started=threading.Event();timer=QTimer(window)
              timer.setTimerType(Qt.TimerType.PreciseTimer)
              timer.timeout.connect(lambda:ticks.append(1));timer.start(5)
              def job(progress,event):
                  started.set()
                  while not event.wait(.01):pass
                  raise cm.ProcessingCancelled()
              window.tool('workflow').staged=False;window.tool('workflow').job=lambda options:job
              try:
                  QTest.mouseClick(window.run_button,Qt.MouseButton.LeftButton)
                  deadline=time.monotonic()+2
                  while (len(ticks)<3 or not started.is_set()) and time.monotonic()<deadline:
                      QTest.qWait(10)
                  assert started.is_set() and len(ticks)>=3 and window.thread is not None
                  QTest.mouseClick(window.cancel_button,Qt.MouseButton.LeftButton);finish(window)
                  assert window.status.text()=="Traitement interrompu."
              finally:
                  timer.stop()
                  if window.thread is not None:
                      window.cancel();finish(window)
                  window.close();QTest.qWait(20)
          '''
          if 'QTest.qWait(80)' in old:
              assert 'finally:' not in old, 'Unexpected cancellation test structure'
              text = text.replace(old, replacement.rstrip(), 1)
          else:
              assert 'finally:' in old and 'PreciseTimer' in old
          ast.parse(text)
          path.write_text(text, encoding='utf-8')
      - name: Record the test cleanup fix
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_desktop.py
          if ! git diff --cached --quiet; then
            git commit -m 'Always release cancellation-test workers and await observable Qt responsiveness'
            git push origin HEAD:real-project-validation
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  validate:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
      PYTHONUTF8: '1'
      PYTHONFAULTHANDLER: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install Qt runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libopengl0
      - name: Install application
        run: python -m pip install -q -e ".[dev,notebook,distributed]" pytest-timeout
      - name: Repeat native worker start, cancel and close cycles
        shell: python
        run: |
          import subprocess, sys
          for repeat in range(5):
              subprocess.run([sys.executable, '-m', 'pytest', '-q', 'tests/test_desktop_lifecycle.py',
                              'tests/test_desktop.py::test_background_job_keeps_event_loop_responsive_and_cancels',
                              '--timeout=60', f'--junitxml=reports/lifecycle-{repeat}.xml'], check=True)
      - name: Run the complete regression suite
        run: python -m pytest -q --timeout=180 --junitxml=reports/regressions.xml
      - name: Build verified distribution
        run: |
          python -m build --outdir dist-validation > build.log
          python -m twine check --strict dist-validation/*
          python scripts/check_release.py dist-validation
      - name: Test clean installation
        shell: python
        run: |
          from pathlib import Path
          import subprocess, sys
          wheels = list(Path('dist-validation').glob('cartomize-*.whl'))
          assert len(wheels) == 1
          subprocess.run([sys.executable, 'scripts/verify_installed_release.py', '--wheel', str(wheels[0]),
                          '--output', 'reports/installed/installation.json'], check=True)
      - name: Preserve regression and distribution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cartomize-lifecycle-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            reports/
            dist-validation/
          retention-days: 30
