name: Desktop cross-platform validation

on:
  push:
    branches: [main]
    paths:
      - 'src/cartomize/**'
      - 'tests/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - '.github/workflows/desktop-ubuntu.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
      PYTHONFAULTHANDLER: '1'
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Linux Qt runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0
      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,notebook,distributed]"
      - name: Compile interface source
        run: python -m compileall -q src/cartomize
      - name: Run desktop smoke tests
        run: python -m pytest -q tests/test_desktop_shell_smoke.py --junitxml=reports/desktop.xml
      - name: Run full test suite
        if: '!cancelled()'
        run: python -m pytest -ra --junitxml=reports/full-suite.xml
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-reports-${{ matrix.os }}-py${{ matrix.python-version }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14
