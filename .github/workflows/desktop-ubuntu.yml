name: Desktop cross-platform validation

on:
  push:
    branches: [main]
    paths:
      - "src/cartomize/**"
      - "tests/test_desktop_shell_smoke.py"
      - ".github/workflows/desktop-ubuntu.yml"
  workflow_dispatch:

jobs:
  desktop-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui,dev]"
      - name: Compile interface source
        run: python -m compileall -q src/cartomize
      - name: Run desktop smoke tests
        run: python -m pytest -q tests/test_desktop_shell_smoke.py
      - name: Run full test suite
        run: python -m pytest -q
