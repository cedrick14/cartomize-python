name: Demonstration Carto - real Sentinel-2

on:
  push:
    branches:
      - main
      - feature/demonstration-carto-layout
      - "fix/**"
    paths:
      - "demonstration-carto/**"
      - ".github/workflows/demonstration-carto.yml"
  pull_request:
    branches:
      - main
    paths:
      - "demonstration-carto/**"
      - ".github/workflows/demonstration-carto.yml"

permissions:
  contents: write

jobs:
  real-sentinel-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Cartomize and notebook runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[notebook]"

      - name: Download a real Sentinel-2 L2A subset
        run: python demonstration-carto/download_real_data.py

      - name: Diagnose the downloaded real subset
        run: python demonstration-carto/preflight_real_data.py

      - name: Execute the tutorial notebook
        env:
          MPLBACKEND: Agg
          QT_QPA_PLATFORM: offscreen
        run: |
          jupyter nbconvert --to notebook --execute demonstration-carto/Tutoriel_Demonstration_Cartomize.ipynb             --output Tutoriel_Demonstration_Cartomize.ipynb             --output-dir demonstration-carto             --ExecutePreprocessor.timeout=900

      - name: Verify scientific outputs
        run: python demonstration-carto/verify_demo.py

      - name: Upload reproducibility package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demonstration-carto-real-sentinel
          path: |
            demonstration-carto/data
            demonstration-carto/results
            demonstration-carto/preflight
            demonstration-carto/Tutoriel_Demonstration_Cartomize.ipynb
            demonstration-carto/README.md
            demonstration-carto/GUIDE_INTERFACE.md
            demonstration-carto/SOURCES.md

      - name: Commit verified real data and executed results to the branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demonstration-carto/data demonstration-carto/results demonstration-carto/Tutoriel_Demonstration_Cartomize.ipynb
          if ! git diff --cached --quiet; then
            git commit -m "Update verified real Sentinel-2 demonstration evidence [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
