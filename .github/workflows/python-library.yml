name: G06 Windows layout diagnosis
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compact:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev,notebook,distributed]"
      - name: Measure the production compact forms on Windows
        run: python -m pytest tests/test_vector_quality_interfaces.py tests/test_g01_desktop.py tests/test_desktop_reprojection.py tests/test_desktop_merge.py::test_merge_form_fits_compact_window tests/test_desktop_conversion.py -k compact_window -q -s
        env:
          QT_QPA_PLATFORM: offscreen
