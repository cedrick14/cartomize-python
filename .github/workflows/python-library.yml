name: Cartomize Python library
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,notebook,distributed]"
      - run: python -m pytest
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python -m build
      - run: python -m twine check dist/*

  qgis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install QGIS native runtime
        timeout-minutes: 10
        run: |
          # Preserve the runner's signed Ubuntu sources; prefer the official HTTPS archives.
          # Azure mirror throughput issue: https://github.com/actions/runner-images/issues/14823
          printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\nhttp://azure.archive.ubuntu.com/ubuntu/\tpriority:3\n' | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y python3-qgis libegl1 libopengl0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - name: Exercise native QGIS project and exports
        run: python -m pytest tests/test_native_runtime.py -v
        env:
          QT_QPA_PLATFORM: offscreen
          CARTOMIZE_QGIS_PYTHON: /usr/bin/python3
