name: Cartomize PyPI

on:
  push:
    branches: [main]
    tags: ['python-v*']
  workflow_dispatch:
    inputs:
      index:
        description: 'Destination (check = validation only)'
        type: choice
        default: check
        options: [check, testpypi, pypi]

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}-${{ inputs.index || 'check' }}
  cancel-in-progress: false

jobs:
  windows-conda:
    uses: ./.github/workflows/windows-conda.yml

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0
          python -m pip install -e ".[dev,notebook,distributed]"
      - name: Test
        run: python -m pytest
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build and validate the two release files
        run: |
          python -m build --outdir pypi-dist
          python -m twine check --strict pypi-dist/*
          python scripts/check_release.py pypi-dist
      - uses: actions/upload-artifact@v4
        with:
          name: cartomize-pypi-distributions
          path: pypi-dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [build, windows-conda]
    if: >-
      github.repository == 'cedrick14/cartomize-python' && (
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/python-v')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish pypi]')) ||
      (github.event_name == 'workflow_dispatch' && inputs.index != 'check'))
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.index == 'testpypi' && 'testpypi' || 'pypi' }}
      url: ${{ inputs.index == 'testpypi' && 'https://test.pypi.org/p/cartomize' || 'https://pypi.org/p/cartomize' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cartomize-pypi-distributions
          path: dist/
      - name: Publish to PyPI
        if: inputs.index != 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
      - name: Publish to TestPyPI
        if: inputs.index == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/
