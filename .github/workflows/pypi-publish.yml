name: Cartomize PyPI

on:
  push:
    branches: [main]
    tags: ['python-v*']
  workflow_dispatch:
    inputs:
      index:
        description: 'Destination (check = validation only)'
        type: choice
        default: check
        options: [check, testpypi, pypi]
      delivery:
        description: 'Publish the verified wheel, sources and demonstration on GitHub'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}-${{ inputs.index || 'check' }}
  cancel-in-progress: false

jobs:
  windows-conda:
    uses: ./.github/workflows/windows-conda.yml

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0
          python -m pip install -e ".[dev,notebook,distributed]"
      - name: Verify result view lifecycle before desktop processing
        run: python -m pytest tests/test_results_workspace.py tests/test_desktop_imagery.py -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Test
        run: python -m pytest
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build and validate the two release files
        run: |
          python -m build --outdir pypi-dist
          python -m twine check --strict pypi-dist/*
          python scripts/check_release.py pypi-dist
      - uses: actions/upload-artifact@v4
        with:
          name: cartomize-complete-distributions
          path: pypi-dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Stage files eligible for the selected public version
        run: python scripts/stage_pypi_upload.py pypi-dist publish-dist
      - uses: actions/upload-artifact@v4
        with:
          name: cartomize-pypi-distributions
          path: publish-dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Build the portable demonstration delivery
        run: python scripts/build_demo_delivery.py --dist-dir pypi-dist --output delivery-dist/cartomize-1.0-presentation.zip
      - uses: actions/upload-artifact@v4
        with:
          name: cartomize-demonstration-delivery
          path: delivery-dist/*
          if-no-files-found: error
          retention-days: 14

  delivery:
    needs: [build, windows-conda]
    if: >-
      github.repository == 'cedrick14/cartomize-python' && (
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish delivery]')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.delivery))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: cartomize-complete-distributions
          path: pypi-dist/
      - uses: actions/download-artifact@v4
        with:
          name: cartomize-demonstration-delivery
          path: delivery-dist/
      - name: Identify the immutable delivery
        id: delivery
        run: |
          python - <<'PY'
          import configparser, os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          config = configparser.ConfigParser()
          config.read('setup.cfg')
          build = config.get('bdist_wheel', 'build_number')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag=cartomize-{version}-{build}\n')
          PY
      - name: Publish the complete Cartomize 1.0 delivery
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_TAG: ${{ steps.delivery.outputs.tag }}
        run: >-
          gh release create "$RELEASE_TAG" pypi-dist/* delivery-dist/*.zip
          --target "$RELEASE_COMMIT" --latest
          --title "Cartomize 1.0"
          --notes-file docs/RELEASE_1.0.md

  publish:
    needs: [build, windows-conda]
    if: >-
      github.repository == 'cedrick14/cartomize-python' && (
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/python-v')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish pypi]')) ||
      (github.event_name == 'workflow_dispatch' && inputs.index != 'check'))
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.index == 'testpypi' && 'testpypi' || 'pypi' }}
      url: ${{ inputs.index == 'testpypi' && 'https://test.pypi.org/p/cartomize' || 'https://pypi.org/p/cartomize' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: cartomize-pypi-distributions
          path: dist/
      - name: Verify the release description before upload
        env:
          PACKAGE_INDEX: ${{ inputs.index == 'testpypi' && 'testpypi' || 'pypi' }}
        run: |
          if [ "$PACKAGE_INDEX" = "pypi" ]; then
            python scripts/check_pypi_metadata.py dist --index "$PACKAGE_INDEX" --allow-existing-description-mismatch
          else
            python scripts/check_pypi_metadata.py dist --index "$PACKAGE_INDEX"
          fi
      - name: Publish to PyPI
        if: inputs.index != 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
      - name: Publish to TestPyPI
        if: inputs.index == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/
